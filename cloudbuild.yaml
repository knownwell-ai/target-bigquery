# Pull-request check: build the project with Google Cloud's buildpacks and run the
# full test suite, integration tests included, inside the resulting image.
#
# The Python buildpack detects poetry.lock, installs a pinned Poetry, and runs
# `poetry install --sync --only main --no-root` (see cmd/python/poetry and
# pkg/python/pyproject.go in github.com/GoogleCloudPlatform/buildpacks), so the image
# carries the locked runtime dependencies plus Poetry itself, but not the dev group.
# The test step points Poetry at that same virtualenv (via VIRTUAL_ENV) and adds the
# dev group from the lock file before running pytest.
#
# The integration tests need a BigQuery project, a dataset and a GCS bucket. They
# take no credentials: the clients fall back to Application Default Credentials, so
# the build's own service account is the identity that writes to BigQuery and GCS.
# The three location substitutions default to empty, and with them unset
# target_bigquery/tests/conftest.py skips the integration tests, so a manual
# `gcloud builds submit` without substitutions still runs the unit tests cleanly.
#
# This file contains no organisation-specific values. Anything environment-specific
# is expected to arrive through Cloud Build trigger substitutions.
steps:
  - id: build-image
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - target-bigquery-ci
      - --builder
      - gcr.io/buildpacks/builder:google-24
      - --trust-builder
      - --network
      - cloudbuild
      - --env
      - GOOGLE_PYTHON_VERSION=3.13.*

  # `launcher` applies the buildpack layers' environment (Python and the venv on PATH).
  # The leading `--` makes it exec the command directly: without it, the launcher
  # rewrites every argument through `eval echo`, which silently mangles an inline
  # script containing quotes, comments or $(...) into an empty command that exits 0.
  #
  # All three pytest runs live in one step because each Cloud Build step starts a
  # fresh container from the image: only /workspace persists between steps, so the
  # dev-group install would be lost. They run in the order the GitHub workflow used
  # historically - SDK standard tests, unit tests, then the sync integration tests.
  - id: tests
    name: target-bigquery-ci
    entrypoint: launcher
    env:
      # Cloud Build sets HOME to a root-owned directory and the buildpack image runs as
      # a non-root user, so Poetry's default cache location is not writable.
      - POETRY_CACHE_DIR=/tmp/poetry-cache
      - BQ_PROJECT=${_BQ_PROJECT}
      - BQ_DATASET=${_BQ_DATASET}
      - GCS_BUCKET=${_GCS_BUCKET}
    args:
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        # The buildpack prepends its virtualenv's bin directory to PATH; make it the
        # active environment so Poetry installs the dev group into it.
        export VIRTUAL_ENV="$$(dirname "$$(dirname "$$(command -v python)")")"
        poetry install --with dev --no-root
        python -m pytest target_bigquery/tests/test_core.py -p no:cacheprovider
        python -m pytest target_bigquery/tests/test_utils.py target_bigquery/tests/test_config.py -p no:cacheprovider
        python -m pytest target_bigquery/tests/test_sync.py -p no:cacheprovider

substitutions:
  # Supplied by the trigger. Left empty so manual builds skip the integration tests.
  _BQ_PROJECT: ''
  _BQ_DATASET: ''
  _GCS_BUCKET: ''

timeout: 1200s

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
