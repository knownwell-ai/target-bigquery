# Pull-request check: build the project with Google Cloud's buildpacks and run the
# side-effect-free unit tests inside the resulting image.
#
# The Python buildpack detects poetry.lock, installs a pinned Poetry, and runs
# `poetry install --sync --only main --no-root` (see cmd/python/poetry and
# pkg/python/pyproject.go in github.com/GoogleCloudPlatform/buildpacks), so the image
# carries the locked runtime dependencies plus Poetry itself, but not the dev group. The test step points
# Poetry at that same virtualenv (via VIRTUAL_ENV) and adds the dev group from the
# lock file before running pytest. Integration tests need BigQuery credentials and
# are excluded by marker; see target_bigquery/tests/conftest.py.
#
# This file contains no organisation-specific values. Anything environment-specific
# is expected to arrive through Cloud Build trigger substitutions.
steps:
  - id: build-image
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - target-bigquery-ci
      - --builder
      - gcr.io/buildpacks/builder:google-24
      - --trust-builder
      - --network
      - cloudbuild
      - --env
      - GOOGLE_PYTHON_VERSION=3.13.*

  # `launcher` applies the buildpack layers' environment (Python and the venv on PATH).
  # The leading `--` makes it exec the command directly: without it, the launcher
  # rewrites every argument through `eval echo`, which silently mangles an inline
  # script containing quotes, comments or $(...) into an empty command that exits 0.
  - id: unit-tests
    name: target-bigquery-ci
    entrypoint: launcher
    env:
      # Cloud Build sets HOME to a root-owned directory and the buildpack image runs as
      # a non-root user, so Poetry's default cache location is not writable.
      - POETRY_CACHE_DIR=/tmp/poetry-cache
    args:
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        # The buildpack prepends its virtualenv's bin directory to PATH; make it the
        # active environment so Poetry installs the dev group into it.
        export VIRTUAL_ENV="$$(dirname "$$(dirname "$$(command -v python)")")"
        poetry install --with dev --no-root
        python -m pytest -m "not integration" -p no:cacheprovider

timeout: 1200s

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
