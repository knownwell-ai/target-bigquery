# Release: build the sdist and wheel and publish them to a Python package repository.
# Intended to run from a trigger on version tags (v<major>.<minor>.<patch>).
#
# The image is built with Google Cloud's buildpacks exactly as in cloudbuild-deploy.yaml, so
# Poetry is available without installing it by hand and the lock file is validated on
# every release. The buildpack image runs as a non-root user, and the /workspace volume
# is owned by root, so a root step makes dist/ writable before `poetry build` runs.
#
# Required trigger substitution (no organisation-specific values live in this file):
#   _PYTHON_REPOSITORY_URL  Artifact Registry Python repository URL, e.g.
#                           https://<location>-python.pkg.dev/<project>/<repository>/
steps:
  - id: build-image
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - target-bigquery-release
      - --builder
      - gcr.io/buildpacks/builder:google-24
      - --trust-builder
      - --network
      - cloudbuild
      - --env
      - GOOGLE_PYTHON_VERSION=3.13.*

  - id: prepare-dist
    name: gcr.io/k8s-skaffold/pack
    entrypoint: sh
    args:
      - -c
      - mkdir -p dist && chmod 0777 dist

  # `launcher --` execs the command directly with the buildpack environment applied;
  # see the note in cloudbuild-deploy.yaml for why the `--` matters.
  - id: build-package
    name: target-bigquery-release
    entrypoint: launcher
    env:
      - TAG_NAME=$TAG_NAME
      # Cloud Build sets HOME to a root-owned directory and the buildpack image runs as
      # a non-root user, so Poetry's default cache location is not writable.
      - POETRY_CACHE_DIR=/tmp/poetry-cache
    args:
      - --
      - bash
      - -c
      - |
        set -euo pipefail
        # Use the buildpack's virtualenv (first on PATH) as Poetry's environment.
        # Cloud Build sets HOME to a root-owned directory, so Poetry must not try
        # to create an environment of its own.
        export VIRTUAL_ENV="$$(dirname "$$(dirname "$$(command -v python)")")"
        version="$$(poetry version -s)"
        # When started by a tag trigger, refuse to publish a version that does not
        # match the tag. Manual runs have no TAG_NAME and skip the check.
        if [ -n "$${TAG_NAME}" ] && [ "$${TAG_NAME}" != "v$${version}" ]; then
          echo "Tag $${TAG_NAME} does not match pyproject.toml version $${version}" >&2
          exit 1
        fi
        poetry build

artifacts:
  pythonPackages:
    - repository: ${_PYTHON_REPOSITORY_URL}
      paths:
        - dist/*

timeout: 1200s

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
