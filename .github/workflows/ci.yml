name: Tests

# Runs the side-effect-free unit tests only. The integration tests need a real
# BigQuery project and GCS bucket and run in Cloud Build (cloudbuild.yaml), which
# authenticates as a service account instead of holding credentials as secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**.py"
      - "poetry.lock"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "poetry.lock"
  workflow_dispatch:
    inputs: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        py_version: ["3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.py_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_version }}
      - name: Install Target Bigquery
        run: |
          python -m pip install --upgrade pip poetry
          poetry install
      - name: Run unit tests
        run: |
          poetry run pytest -m "not integration"
